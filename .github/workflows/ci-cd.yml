name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read
  pages: write
  id-token: write

jobs:
  # =================================================================
  # JOB 1: Test & Verify Code Quality (Automated on Push / PR / Dispatch)
  # =================================================================
  verify:
    name: Run Tests, Lint & Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7 # pin: check with actionlint
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Hydrate .env from secrets
        env:
          GOOGLE_ADS_API_KEY: ${{ secrets.GOOGLE_ADS_API_KEY }}
          VARS_APPLICATION_ID: ${{ vars.APPLICATION_ID }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          if ! grep -q "^KEYSTORE_PATH=" .env; then
            echo "KEYSTORE_PATH=keystore/release.jks" >> .env
          fi
          if [ -n "$GOOGLE_ADS_API_KEY" ]; then
            sed -i "s|^GOOGLE_ADS_API_KEY=.*|GOOGLE_ADS_API_KEY=$GOOGLE_ADS_API_KEY|" .env
          fi
          if [ -n "$VARS_APPLICATION_ID" ]; then
            sed -i "s|^APPLICATION_ID=.*|APPLICATION_ID=$VARS_APPLICATION_ID|" .env
          fi
          echo "[*] .env hydrated:"
          grep -E "^(APPLICATION_ID|BUILD_TARGET|VERSION_CODE|VERSION_NAME|KEYSTORE_PATH|GOOGLE_ADS_API_KEY)=" .env | sed 's/GOOGLE_ADS_API_KEY=.*/GOOGLE_ADS_API_KEY=***/'
          mkdir -p qc/reports/{lint,tests,roborazzi,gitleaks} qc/artifacts/{apks,screenshots/manual} qc/traces

      - name: Verify Prerequisites
        run: ./scripts/check_requirements.sh

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare QC report dirs
        if: always()
        run: mkdir -p qc/reports/{lint,tests,roborazzi,gitleaks}

      - name: Copy Unit Test Reports to qc/reports
        if: always()
        run: |
          mkdir -p qc/reports/tests
          if [ -d app/build/reports/tests ]; then cp -r app/build/reports/tests/* qc/reports/tests/ 2>/dev/null || true; fi
          if [ -d app/build/test-results ]; then cp -r app/build/test-results qc/reports/tests/ 2>/dev/null || true; fi
          ls -R qc/reports/tests 2>/dev/null | head -n 50 || true

      - name: Run Roborazzi Visual Matrix (blocking)
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Copy Lint Reports to qc/reports
        if: always()
        run: |
          mkdir -p qc/reports/lint
          if [ -d app/build/reports ]; then cp -r app/build/reports/lint* qc/reports/lint/ 2>/dev/null || true; fi
          if [ -f app/build/reports/lint-results-debug.html ]; then cp app/build/reports/lint-results-debug.html qc/reports/lint/ 2>/dev/null || true; fi
          if [ -f app/build/reports/lint-results-debug.xml ]; then cp app/build/reports/lint-results-debug.xml qc/reports/lint/ 2>/dev/null || true; fi
          ls -R qc/reports/lint 2>/dev/null | head -n 30 || true

      - name: Scan for Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Workflow Files (actionlint)
        uses: reviewdog/action-actionlint@v1.80.3

      - name: Upload QC Reports Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qc-reports
          path: qc/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Lint HTML Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

  # =================================================================
  # JOB 2: Build, Sign & Release Artifacts (tags + manual artifact builds)
  # =================================================================
  build-and-release:
    name: Build, Sign & Publish Release
    needs: verify
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Hydrate .env Configuration
        env:
          GOOGLE_ADS_API_KEY: ${{ secrets.GOOGLE_ADS_API_KEY }}
          VARS_APPLICATION_ID: ${{ vars.APPLICATION_ID }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          if ! grep -q "^KEYSTORE_PATH=" .env; then
            echo "KEYSTORE_PATH=keystore/release.jks" >> .env
          fi
          if [ -n "$GOOGLE_ADS_API_KEY" ]; then
            sed -i "s|^GOOGLE_ADS_API_KEY=.*|GOOGLE_ADS_API_KEY=$GOOGLE_ADS_API_KEY|" .env
          fi
          if [ -n "$VARS_APPLICATION_ID" ]; then
            sed -i "s|^APPLICATION_ID=.*|APPLICATION_ID=$VARS_APPLICATION_ID|" .env
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            TAG_SUFFIX=$(printf '%03d' $((GITHUB_RUN_NUMBER % 1000)))
            TAG_CODE="$(date +%y%m%d)${TAG_SUFFIX}"
            sed -i "s|^VERSION_NAME=.*|VERSION_NAME=${TAG_VERSION}|" .env
            sed -i "s|^VERSION_CODE=.*|VERSION_CODE=${TAG_CODE}|" .env
            echo "[*] Tag build: VERSION_NAME=${TAG_VERSION}, VERSION_CODE=${TAG_CODE}"
          fi
          echo "[*] .env for release:"
          grep -E "^(APPLICATION_ID|BUILD_TARGET|VERSION_CODE|VERSION_NAME|KEYSTORE_PATH|GOOGLE_ADS_API_KEY)=" .env | sed 's/GOOGLE_ADS_API_KEY=.*/GOOGLE_ADS_API_KEY=***/'

      - name: Decode Keystore to .env subfolder path
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH=$(grep -E "^KEYSTORE_PATH=" .env | cut -d= -f2- | tr -d '\r"' | xargs)
          KEYSTORE_PATH=${KEYSTORE_PATH:-keystore/release.jks}
          echo "[*] KEYSTORE_PATH=$KEYSTORE_PATH"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "[+] Keystore decoded to $KEYSTORE_PATH"
            ls -l "$KEYSTORE_PATH" || true
          else
            echo "::warning title=Debug-signed release::KEYSTORE_BASE64 is not configured; generating an ephemeral debug keystore for this build."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -5
          fi

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Build Release Binaries
        env:
          KEYSTORE_PATH: keystore/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SKIP_VERSION_BUMP: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          # ternary form preferred by actionlint, equivalent: startsWith(...) ? '1' : '0'
        run: |
          echo "[*] SKIP_VERSION_BUMP=$SKIP_VERSION_BUMP (1=tag source of truth, 0=manual build may bump)"
          export SKIP_VERSION_BUMP
          bash scripts/build.sh assembleRelease
          bash scripts/build_play_console_release.sh

      - name: Stage Release Assets
        run: |
          # actions/upload-artifact and action-gh-release ignore dot-directories
          # by default, so copy the hidden .build-outputs tree to a visible path.
          rm -rf release-assets
          mkdir -p release-assets
          find .build-outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release-assets/ \;
          ls -lh release-assets
          ASSET_COUNT=$(find release-assets -type f | wc -l)
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error title=Missing release assets::No APK/AAB files were produced by the release build."
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-outputs
          path: release-assets/
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Milkys Sound Booster Release ${{ github.ref_name }}"
          body: |
            Release for `${{ github.ref_name }}` (Commit: `${{ github.sha }}`).
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =================================================================
  # JOB 3: Publish QC Reports to GitHub Pages (Full + Pages)
  # =================================================================
  publish-pages:
    name: Publish QC Reports to Pages
    needs: [verify, build-and-release]
    # Pages must be enabled in repository settings and ENABLE_PAGES=true set as
    # a repository variable. Until then, QC reports remain available as the
    # qc-reports workflow artifact, so this optional job stays skipped.
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download QC Reports Artifact
        uses: actions/download-artifact@v8
        with:
          name: qc-reports
          path: qc/reports

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: qc/reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # =================================================================
  # JOB 4: Auto-Fix Failures via Google Jules (Triggers on ANY Job Failure)
  # =================================================================
  jules-fix:
    name: Trigger Google Jules Fixer Agent
    needs: [verify, build-and-release]
    if: always() && (needs.verify.result == 'failure' || needs.build-and-release.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: jules-fix-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Jules API key
        id: jules_key
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -n "$JULES_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Jules skipped::JULES_API_KEY is not configured for this repository."
          fi

      - name: Invoke Google Jules
        if: steps.jules_key.outputs.present == 'true'
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.head_ref || 'main' }}
          include_last_commit: true
          include_commit_log: true
          prompt: |
            Fix CI failure for workflow `${{ github.workflow }}` run `${{ github.run_id }}` (ref `${{ github.ref }}`, event `${{ github.event_name }}`).
            Results: verify=${{ needs.verify.result }}, build-and-release=${{ needs.build-and-release.result }}.

            Context: KEYSTORE_PATH=keystore/release.jks via .env subfolder (fallback debug.keystore OK for verify); bump disabled when ref is refs/tags/v* (SKIP_VERSION_BUMP=1, tag is source of truth, see scripts/bump_version.py); Roborazzi blocking (./gradlew verifyRoborazziDebug, output qc/reports/roborazzi, reference app/src/test/screenshots/).

            Please perform:
            1. Review AGENTS.md, qc_plan.md §9, .jules/config.yaml + .jules/rules.md, and scripts/setup_jules_env.sh for repository rules and verification commands.
            2. Check workflow logs to determine whether failure occurred during static verification (./gradlew testDebugUnitTest, lintDebug, verifyRoborazziDebug) or during release compilation (scripts/build.sh, scripts/build_play_console_release.sh — note keystore subfolder handle).
            3. Reproduce and fix the issue inside your environment (respect protected_paths keystore/*, *.jks, .env, qc/changelogs/* and audio safety 1500 mB cap).
            4. Never reintroduce commit hashes or build timestamps into screenshot-visible UI. If a visual diff is intentional, re-record references under app/src/test/screenshots/ and explain why.
            5. Verify: ./scripts/check_requirements.sh && ./gradlew testDebugUnitTest lintDebug verifyRoborazziDebug && verifyRoborazziDebug again && SKIP_VERSION_BUMP=0 ./scripts/build.sh assembleDebug
            6. Submit a Pull Request with summary, verification logs, and evidence pointers to qc/reports/*.
